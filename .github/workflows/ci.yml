name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: 1
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: 1
          - os: macos-latest
            goos: linux
            goarch: amd64
            cgo: 0
          - os: macos-latest
            goos: linux
            goarch: arm64
            cgo: 0
          - os: macos-latest
            goos: windows
            goarch: amd64
            cgo: 0
          - os: macos-latest
            goos: windows
            goarch: arm64
            cgo: 0

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare libusb binaries
        run: bash scripts/prepare-libusb.sh

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/dbibackend

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare libusb binaries
        run: bash scripts/prepare-libusb.sh

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
