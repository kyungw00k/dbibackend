name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare libusb binaries
        run: bash scripts/prepare-libusb.sh

      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: goreleaser
          changelog-file: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Build macOS app bundle & DMG
        if: steps.semrel.outputs.version != ''
        run: bash scripts/build-macos-app.sh "${{ steps.semrel.outputs.version }}"

      - name: Upload DMG to release
        if: steps.semrel.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.semrel.outputs.version }}" \
            "dist/dbibackend_${{ steps.semrel.outputs.version }}_macos_universal.dmg" --clobber

      - name: Update brew cask
        if: steps.semrel.outputs.version != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          bash scripts/update-cask.sh "${{ steps.semrel.outputs.version }}" \
            "dist/dbibackend_${{ steps.semrel.outputs.version }}_macos_universal.dmg"

      - name: Summary
        if: steps.semrel.outputs.version != ''
        run: |
          echo "### Released v${{ steps.semrel.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: v${{ steps.semrel.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- [Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.semrel.outputs.version }})" >> $GITHUB_STEP_SUMMARY
