name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare libusb binaries
        run: bash scripts/prepare-libusb.sh

      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: goreleaser
          changelog-file: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # DMG/cask steps deliberately do not require the semantic-release step
      # to succeed: a failed channel hook (e.g. an expired scoop token) must
      # not block macOS app distribution. The version is derived from the
      # latest tag and the bundle is built from that tag.
      - name: Build macOS app bundle & DMG
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          [ -n "$VERSION" ] || { echo "no tags; skipping"; exit 0; }
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '_macos_universal.dmg'; then
            echo "v${VERSION} already has a DMG; skipping"
            exit 0
          fi
          git checkout -q "v${VERSION}"
          bash scripts/build-macos-app.sh "$VERSION"
          echo "DMG_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload DMG to release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "${DMG_VERSION:-}" ] || exit 0
          gh release upload "v${DMG_VERSION}" \
            "dist/dbibackend_${DMG_VERSION}_macos_universal.dmg" \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Update brew cask
        if: ${{ !cancelled() }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "${DMG_VERSION:-}" ] || exit 0
          bash scripts/update-cask.sh "${DMG_VERSION}" \
            "dist/dbibackend_${DMG_VERSION}_macos_universal.dmg"

      - name: Summary
        if: steps.semrel.outputs.version != ''
        run: |
          echo "### Released v${{ steps.semrel.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: v${{ steps.semrel.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- [Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.semrel.outputs.version }})" >> $GITHUB_STEP_SUMMARY
